# Full-Duplex-Bench v1.0 evaluation - S2S OFFLINE backend.
# FC checkpoint, greedy decoding (temperature=0).
#
# Mirrors fdb_s2s_incremental_v2_02mar_config_fc_greedy.yaml but routes
# generation through the offline DSFTS codebase + nemo_duplex container.
# Uses --backend s2s_voicechat --decode_audio so downstream FDB ASR scoring
# still has audio to consume.
#
# Run:
#   python nemo_skills/dataset/fdb/scripts/run_eval.py \
#     --config nemo_skills/dataset/fdb/scripts/fdb_s2s_offline_02mar_config_fc_greedy.yaml

cluster: s2s_eval_oci_iad_oncluster
partition: batch_block1,batch_block3,batch_block4
cpu_partition: cpu_short

model: /lustre/fsw/portfolios/llmservice/users/vtrinh/projects/function_calling_share/pretrained_s2s_rnnt_ckpt/Apr_02_2026/e70/e70-step28008-tts-eartts-34014_asr_cand3_0.6b-PK_ep0_01988_300

server_type: vllm
server_gpus: 1
num_chunks: 8

server_entrypoint: "-m nemo_skills.inference.server.serve_unified"
server_args: >-
  --backend s2s_voicechat
  --decode_audio
  --config_path /lustre/fsw/portfolios/llmservice/users/kevinhu/projects/duplex-stt/config/inference/infer_nano_eartts_Fullduplexbench_Jan22_2026.yaml
  --speaker_reference /lustre/fsw/portfolios/convai/users/ecasanova/Checkpoints/Mg_a_00759.wav
  --tts_ckpt_path /lustre/fsw/portfolios/convai/users/ecasanova/Checkpoints/Duplex_EARTTS/eartts_rvq_cont_task_nanov2_tts_pretraining_wordlist_duplex_data_new_branch_4nodes_duplex_eartts_2_delay_4rd_stage_fp32_wd_1500_et_eos_dp_eos_dup_step_10004.ckpt
  --extra_decoding_seconds 0
  --ignore_system_prompt
  --inference_pad_boost -0.5
  --inference_bos_boost 0.5
  --inference_eos_boost 0
  --dtype float32
  --temperature 0.0
  --top_p 1.0
  --repetition_penalty 1.0
  --force_turn_taking
  --code_path /lustre/fsw/portfolios/llmservice/users/yuanhangs/codes/NeMo/NeMo_Voice_Chat_DSFTS

server_container: /lustre/fsw/portfolios/convai/users/ecasanova/docker_images/nemo_duplex_november_eartts.sqsh
scoring_container: /lustre/fsw/portfolios/convai/users/ecasanova/docker_images/nemo_duplex_november_eartts.sqsh
scoring_container_python_exec: python3

server_server_type: vllm_multimodal

fdb_version: v1.0

data_dir: /lustre/fsw/portfolios/llmservice/users/yuanhangs/data/fdb
output_dir: /lustre/fsw/portfolios/llmservice/users/yuanhangs/workspace/voice_chat_offline_greedy/fdb_fc
fdb_repo_path: /lustre/fsw/portfolios/convai/users/mmkrtchyan/projects/speechLM/s2s/Full-Duplex-Bench
fdb_data_path: /lustre/fsw/portfolios/llmservice/users/yuanhangs/data/fdb_raw
# Local snakers4/silero-vad checkout (must contain hubconf.py). Used to pre-populate TORCH_HOME
# so timing analysis (get_timing.py) skips the GitHub download.
silero_vad_dir: /lustre/fsw/portfolios/llmservice/users/yuanhangs/silero-vad

subtests:
  - backchannel
  - pause_candor
  - pause_synthetic
  - turn_taking
  - interruption

installation_command: ""
scoring_installation_command: "pip install numpy scipy scikit-learn soundfile"

# Greedy decoding via Hydra overrides on the offline server's inference config.
inference_overrides: "++inference.temperature=0.0 ++inference.top_p=1.0 ++inference.repetition_penalty=1.0 ++inference.tokens_to_generate=1024"

temperature: 0.0
top_p: 1.0
repetition_penalty: 1.0
force_turn_taking: true

expname: fdb_v1_0_s2s_offline_02mar_fc_greedy
# max_samples: 50

generation_only: false
scoring_only: false
dry_run: false
