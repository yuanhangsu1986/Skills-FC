# Full-Duplex-Bench v1.5 evaluation configuration for S2S incremental V2 backend
# FC (function calling) checkpoint variant - greedy decoding (temperature=0, no repetition penalty).
#
# Run:
#   python nemo_skills/dataset/fdb/scripts/run_eval.py \
#     --config nemo_skills/dataset/fdb/scripts/fdb_s2s_incremental_v2_v1.5_02mar_config_fc_greedy.yaml

cluster: s2s_eval_oci_iad_oncluster
partition: batch_block1,batch_block3,batch_block4
cpu_partition: cpu_short

model: /lustre/fsw/portfolios/llmservice/users/vtrinh/projects/function_calling_share/pretrained_s2s_rnnt_ckpt/Apr_02_2026/e70/e70-step28008-tts-eartts-34014_asr_cand3_0.6b-PK_ep0_01988_300

server_type: vllm
server_gpus: 1
num_chunks: 8

server_entrypoint: "-m nemo_skills.inference.server.serve_unified"
server_args: >-
  --backend s2s_incremental_v2
  --decode_audio
  --speaker_reference /lustre/fsw/portfolios/nemotron/projects/nemotron_speech_chat/users/ecasanova/Checkpoints/Mg_a_00759.wav
  --num_frames_per_inference 3
  --engine_type vllm_llm_vllm_eartts
  --use_perception_cache
  --use_perception_cudagraph
  --use_codec_cache
  --buffer_size_frames 21
  --codec_token_history_size 60
  --matmul_precision medium
  --vllm_gpu_memory_utilization 0.35
  --vllm_max_model_len 8192
  --force_turn_taking
  --inference_user_pad_boost 0.8
  --silence_padding_sec 0
  --max_new_tokens 4500
  --repetition_penalty 1.0
  --ignore_system_prompt
  --merge_user_channel_v2
  --output_dir /lustre/fsw/portfolios/llmservice/users/yuanhangs/workspace/voice_chat_greedy/fdb_v1_5_fc_artifacts
  --code_path /lustre/fsw/portfolios/llmservice/users/yuanhangs/codes/NeMo/NeMo_Voice_Chat_DRIRF
  --pip_install "--cache-dir /lustre/fsw/portfolios/llmservice/users/yuanhangs/cache/pip hf-xet==1.1.9 huggingface-hub==0.34.4 nvidia-modelopt==0.33.1 nvidia-modelopt-core==0.33.1 tokenizers==0.22.0 transformers==4.56.0 lhotse==1.32.2 nv-one-logger-core==2.1.0 nv-one-logger-pytorch-lightning-integration==2.1.0 nv-one-logger-training-telemetry==2.1.0 kaldialign==0.9.1"

server_container: /lustre/fsw/portfolios/llmservice/users/erastorgueva/code/containers/triton25.05_s2svllm26.02.12.sqsh
scoring_container: /lustre/fsw/portfolios/llmservice/projects/llmservice_nemo_mlops/full-duplex/containers/nemo_duplex_november_eartts.sqsh
scoring_container_python_exec: python3

server_server_type: vllm_multimodal

fdb_version: v1.5

data_dir: /lustre/fsw/portfolios/llmservice/users/yuanhangs/data/fdb
output_dir: /lustre/fsw/portfolios/llmservice/users/yuanhangs/workspace/voice_chat_greedy/fdb_v1_5_fc
fdb_repo_path: /lustre/fsw/portfolios/llmservice/users/kevinhu/Full-Duplex-Bench-NV
fdb_data_path: /lustre/fsw/portfolios/llmservice/users/yuanhangs/data/fdb_raw
# Local snakers4/silero-vad checkout (must contain hubconf.py). Used to pre-populate TORCH_HOME
# so v1.5 timing analysis (get_timing.py) skips the GitHub download.
silero_vad_dir: /lustre/fsw/portfolios/llmservice/users/yuanhangs/silero-vad

subtests:
  - backchannel
  - background_speech
  - talking_to_other
  - interruption

installation_command: "mkdir -p /usr/local/lib/python3.12/dist-packages/vllm/model_executor/models && cp /nemo_run/code/asset/nemotron_h.py /usr/local/lib/python3.12/dist-packages/vllm/model_executor/models/nemotron_h.py"
scoring_installation_command: "pip install --cache-dir /lustre/fsw/portfolios/llmservice/users/yuanhangs/cache/pip numpy scipy scikit-learn silero-vad soundfile"

inference_overrides: ""

expname: fdb_v1_5_s2s_incremental_v2_02mar_fc_greedy
# max_samples: 50

generation_only: false
scoring_only: false
dry_run: false
