# Full-Duplex-Bench v3 (FD3) — S2S OFFLINE backend, FC tool-call eval.
# Greedy decoding (temperature=0).
#
# Mirrors fdb_v3_s2s_incremental_v2_config_fc_greedy.yaml but routes
# generation through the offline DSFTS codebase + nemo_duplex container.
# Preserves the FC flags (--decode_function_channel, --tool_call_parser,
# --use_function_channel_for_tool_calls) — verify the offline backend
# in DSFTS accepts them before relying on these scores.

cluster: s2s_eval_oci_iad_oncluster
partition: batch_block1,batch_block3,batch_block4
cpu_partition: cpu_short

model: /lustre/fsw/portfolios/llmservice/users/vtrinh/projects/function_calling_share/pretrained_s2s_rnnt_ckpt/Apr_02_2026/e70/e70-step28008-tts-eartts-34014_asr_cand3_0.6b-PK_ep0_01988_300

server_type: vllm
server_gpus: 1
num_chunks: 4

server_entrypoint: "-m nemo_skills.inference.server.serve_unified"
server_args: >-
  --backend s2s_voicechat
  --decode_audio
  --config_path /lustre/fsw/portfolios/llmservice/users/kevinhu/projects/duplex-stt/config/inference/infer_nano_eartts_Fullduplexbench_Jan22_2026.yaml
  --speaker_reference /lustre/fsw/portfolios/convai/users/ecasanova/Checkpoints/Mg_a_00759.wav
  --tts_ckpt_path /lustre/fsw/portfolios/convai/users/ecasanova/Checkpoints/Duplex_EARTTS/eartts_rvq_cont_task_nanov2_tts_pretraining_wordlist_duplex_data_new_branch_4nodes_duplex_eartts_2_delay_4rd_stage_fp32_wd_1500_et_eos_dp_eos_dup_step_10004.ckpt
  --extra_decoding_seconds 0
  --dtype float32
  --temperature 0.0
  --top_p 1.0
  --repetition_penalty 1.0
  --force_turn_taking
  --use_function_channel_for_tool_calls
  --decode_function_channel
  --tool_call_parser /nemo_run/code/recipes/multimodal/server/tool_calling/nemotron_v2_voicechat_toolcall_parser.py
  --code_path /lustre/fsw/portfolios/llmservice/users/yuanhangs/codes/NeMo/NeMo_Voice_Chat_DSFTS

server_container: /lustre/fsw/portfolios/convai/users/ecasanova/docker_images/nemo_duplex_november_eartts.sqsh
scoring_container: /lustre/fsw/portfolios/convai/users/ecasanova/docker_images/nemo_duplex_november_eartts.sqsh
scoring_container_python_exec: python3

# Scoring runs Parakeet ASR on the generated output audio before invoking the
# FD3 evaluators (response_qual collapses without it). Set scoring_gpus: 0 +
# `--skip_asr` if you only need tool/argument accuracy.
scoring_gpus: 1
scoring_partition: batch_block1,batch_block3,batch_block4

server_server_type: vllm_multimodal

fdb_repo_path: /lustre/fsw/portfolios/llmservice/users/yuanhangs/codes/FDBV3_CHENCHEN

data_dir: /lustre/fsw/portfolios/llmservice/users/yuanhangs/data/fdb
output_dir: /lustre/fsw/portfolios/llmservice/users/yuanhangs/workspace/voice_chat_offline_greedy/fdb_v3_fc

provider: fdb_v3_fc_offline_greedy
expname: fdb_v3_fc_offline_greedy

use_llm_judge: true
skip_latency: false

installation_command: ""
scoring_installation_command: "pip install --cache-dir /lustre/fsw/portfolios/llmservice/users/yuanhangs/cache/pip numpy scipy scikit-learn soundfile pydub openai jinja2"

inference_overrides: "++inference.temperature=0.0 ++inference.top_p=1.0 ++inference.repetition_penalty=1.0 ++inference.tokens_to_generate=4500"

temperature: 0.0
top_p: 1.0
repetition_penalty: 1.0
force_turn_taking: true

generation_only: false
scoring_only: false
dry_run: false
