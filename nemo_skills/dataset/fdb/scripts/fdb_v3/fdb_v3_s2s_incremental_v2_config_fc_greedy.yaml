# Full-Duplex-Bench v3 (FD3) — direct function-head tool-call evaluation.
# Server backend: s2s_incremental_v2. FC checkpoint, greedy decoding (temperature=0).
#
# Run:
#   1) one-time prepare — must write to a Lustre path (NOT into the repo source
#      tree, which would be staged to every job's job_dir):
#      python nemo_skills/dataset/fdb/scripts/fdb_v3/prepare.py \
#        --data_dir /lustre/fsw/portfolios/llmservice/users/yuanhangs/data/fdb
#   2) eval (generation + scoring):
#      python nemo_skills/dataset/fdb/scripts/fdb_v3/run_eval.py \
#        --config nemo_skills/dataset/fdb/scripts/fdb_v3/fdb_v3_s2s_incremental_v2_config_fc_greedy.yaml

cluster: s2s_eval_oci_iad_oncluster
partition: batch_block1,batch_block3,batch_block4
cpu_partition: cpu_short

model: /lustre/fsw/portfolios/llmservice/users/vtrinh/projects/function_calling_share/pretrained_s2s_rnnt_ckpt/Apr_02_2026/e70/e70-step28008-tts-eartts-34014_asr_cand3_0.6b-PK_ep0_01988_300

server_type: vllm
server_gpus: 1
num_chunks: 8

server_entrypoint: "-m nemo_skills.inference.server.serve_unified"
server_args: >-
  --backend s2s_incremental_v2
  --decode_audio
  --speaker_reference /lustre/fsw/portfolios/convai/users/ecasanova/Checkpoints/Mg_a_00759.wav
  --num_frames_per_inference 2
  --engine_type vllm_llm_vllm_eartts
  --use_perception_cache
  --use_perception_cudagraph
  --use_codec_cache
  --buffer_size_frames 25
  --codec_token_history_size 60
  --matmul_precision medium
  --vllm_gpu_memory_utilization 0.35
  --vllm_max_model_len 8192
  --extra_decoding_seconds 60
  --dtype float32
  --inference_guidance_scale 0.5
  --inference_noise_scale 0.8
  --inference_top_p_or_k 0.8
  --inference_user_pad_boost 0.8
  --silence_padding_sec 10
  --max_new_tokens 4500
  --top_p 1.0
  --temperature 0.0
  --repetition_penalty 1.0
  --merge_user_channel_v2
  --use_function_channel_for_tool_calls
  --decode_function_channel
  --tool_call_parser /nemo_run/code/recipes/multimodal/server/tool_calling/nemotron_v2_voicechat_toolcall_parser.py
  --chat_template /nemo_run/code/recipes/multimodal/server/tool_calling/nano_v2_voicechat_toolcalling_chat_template.jinja
  --code_path /lustre/fsw/portfolios/llmservice/users/yuanhangs/codes/NeMo/NeMo_Voice_Chat_DRIRF
  --pip_install "--cache-dir /lustre/fsw/portfolios/llmservice/users/yuanhangs/cache/pip hf-xet==1.1.9 huggingface-hub==0.34.4 nvidia-modelopt==0.33.1 nvidia-modelopt-core==0.33.1 tokenizers==0.22.0 transformers==4.56.0 lhotse==1.32.2 nv-one-logger-core==2.1.0 nv-one-logger-pytorch-lightning-integration==2.1.0 nv-one-logger-training-telemetry==2.1.0 kaldialign==0.9.1 langchain-core"

server_container: /lustre/fsw/portfolios/llmservice/users/erastorgueva/code/containers/triton25.05_s2svllm26.02.12.sqsh
scoring_container: /lustre/fsw/portfolios/convai/users/ecasanova/docker_images/nemo_duplex_november_eartts.sqsh
scoring_container_python_exec: python3

# Scoring runs Parakeet ASR on the generated output audio (and input audio for
# user-speech-end timing) before invoking the FD3 evaluators, so we need 1 GPU.
# Set scoring_gpus: 0 + add `--skip_asr` if you only need tool/argument accuracy
# and are OK with response_qual being judged against the raw S2S text channel.
scoring_gpus: 1
scoring_partition: batch_block1,batch_block3,batch_block4

server_server_type: vllm_multimodal

# FD3 vendored repo: contains FD3/release_code/ (evaluators) + FD3/fdb_v3_data_released/ (samples).
fdb_repo_path: /lustre/fsw/portfolios/llmservice/users/yuanhangs/codes/FDBV3_CHENCHEN

# Opt fdb_v3 in-tree into DRIRF's mock_api multi-turn dispatch (env-gated in
# DRIRF wrapper, default off). When `model: mock_api`, run_eval.py writes a
# per-benchmark patched copy of the cluster config with
#   env_vars: BACKEND_AGENT_MODEL=mock_api, FDB_REPO_PATH=<fdb_repo_path>
# and redirects NEMO_SKILLS_CONFIG_DIR at it for this run only. Other
# DRIRF-using benchmarks (bfcl, conv_behav, bba, voicebench, fdb_v1*) are
# unaffected because the redirect is process-local.
# Set model: "" (or remove the block) to disable.
backend_agent:
  model: "mock_api"

# STOP_AT_LAST_TURN: bound the wrapper's inference loop so the codec doesn't
# run past the model's last meaningful turn (avoids TTS hallucinating
# speech-like audio over long silent tails — the dominant failure mode in
# our FD3 response_qual analysis, ~38% of samples). Pattern-matching state
# machine in DRIRF; no per-sample knowledge needed:
#   1. function-head SOTC (<SPECIAL_20>) disarms the detector — text-head
#      activity during tool-call generation is ignored
#   2. function-head EOTC (<SPECIAL_21>) (re-)arms the detector
#   3. once armed, wait for the text channel to emit a non-PAD token
#      (speech turn began)
#   4. fire when the text channel stays PAD for `quiet_window_sec`
#      consecutive seconds after speech started (speech ended, trim tail)
# Multi-tool-call samples toggle SOTC (off) → EOTC (on) for every call, so
# the watcher only fires during the post-last-EOTC speech turn. Disabled
# for other DRIRF-using benchmarks (bfcl, conv_behav, bba, voicebench,
# fdb_v1*) — leave this section off in their YAMLs.
stop_at_last_turn: true
stop_at_last_turn_quiet_window_sec: 10.0

data_dir: /lustre/fsw/portfolios/llmservice/users/yuanhangs/data/fdb
output_dir: /lustre/fsw/portfolios/llmservice/users/yuanhangs/workspace/voice_chat_greedy/fdb_v3_fc

# Single subtest; per-domain / per-difficulty breakdown comes from FD3 evaluators.
provider: fdb_v3_fc_greedy
expname: fdb_v3_fc_greedy

# LLM judge: openai/openai/gpt-5.2 via NVIDIA inference API (uses NV_INFERENCE_KEY from cluster env).
use_llm_judge: true
skip_latency: false

installation_command: "mkdir -p /usr/local/lib/python3.12/dist-packages/vllm/model_executor/models && cp /nemo_run/code/asset/nemotron_h.py /usr/local/lib/python3.12/dist-packages/vllm/model_executor/models/nemotron_h.py"
scoring_installation_command: "pip install --cache-dir /lustre/fsw/portfolios/llmservice/users/yuanhangs/cache/pip numpy scipy scikit-learn soundfile pydub openai jinja2"

inference_overrides: ""

generation_only: false
scoring_only: false
dry_run: false
