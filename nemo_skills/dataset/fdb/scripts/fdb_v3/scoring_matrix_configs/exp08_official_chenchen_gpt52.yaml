# Full-Duplex-Bench v3 — OFFICIAL variant (faithful to the public benchmark).
#
# Uses our S2S inference MECHANISM but makes every tool-calling surface the model
# and scorer touch faithful to github.com/DanielLin94144/Full-Duplex-Bench v3, and
# depends on ZERO of FDBV3_CHENCHEN:
#   * tool spec      -> official (assets/fd3_tool_spec_official.json, config-injected)
#   * system prompt  -> official (assets/system_prompt_official.txt, config-injected)
#   * mock responses -> official mock_apis.py (mock_api/, via FDB_MOCK_API_IMPL)
#   * scoring        -> official evaluators + benchmark (release_code/, gpt-4o judge
#                       routed through the NVIDIA gateway)
#   * data           -> officially-downloaded fdb_v3_data_released/ (fd3_data_root)
# See nemo_skills/dataset/fdb/scripts/fdb_v3_official/PROVENANCE.md (incl. the two
# faithfulness boundaries: chat-template wrapping is ours; API-latency injection is
# not replicated).
#
# NO separate prepare: generation reuses fdb_v3's prepared USER AUDIO (byte-identical
# NTU recordings) via benchmark: fdb_v3.tool_call; the official prompt + tools are
# injected at generation time (config > test.jsonl), so they need not be re-baked.
# (Provenance note: the generation audio is read from the fdb_v3-prepared copy, which
# is identical content to the official download used for scoring; re-prepare from the
# official data only if you want that file path to be official-sourced too.)
#
# Run:
#   python nemo_skills/dataset/fdb/scripts/fdb_v3/run_eval.py \
#     --config nemo_skills/dataset/fdb/scripts/fdb_v3_official/fdb_v3_official_s2s_incremental_v2_config_fc_greedy.yaml
#
# To score an EXISTING fdb_v3 generation run with the official evaluators instead of
# regenerating: set output_dir to that run's output_dir and add `scoring_only: true`.

cluster: s2s_eval_oci_iad_oncluster_gpt52
partition: batch_block1,batch_block3,batch_block4
cpu_partition: cpu_short

model: /lustre/fsw/portfolios/llmservice/users/yuanhangs/models/e165_v2-step19608-tts-eartts-no_bw_reb_56k_12ksteps_fake_rnnt

server_type: vllm
server_gpus: 1
num_chunks: 8

server_entrypoint: "-m nemo_skills.inference.server.serve_unified"
server_args: >-
  --backend s2s_incremental_v2
  --decode_audio
  --speaker_reference /lustre/fsw/portfolios/convai/users/ecasanova/Checkpoints/Mg_a_00759.wav
  --num_frames_per_inference 2
  --engine_type vllm_llm_vllm_eartts
  --use_perception_cache
  --use_perception_cudagraph
  --use_codec_cache
  --buffer_size_frames 25
  --codec_token_history_size 60
  --matmul_precision medium
  --vllm_gpu_memory_utilization 0.35
  --vllm_max_model_len 8192
  --extra_decoding_seconds 60
  --dtype float32
  --inference_guidance_scale 0.5
  --inference_noise_scale 0.8
  --inference_top_p_or_k 0.8
  --inference_user_pad_boost 0.8
  --silence_padding_sec 10
  --max_new_tokens 4500
  --top_p 1.0
  --temperature 0.0
  --repetition_penalty 1.0
  --merge_user_channel_v2
  --use_function_channel_for_tool_calls
  --decode_function_channel
  --tool_call_parser /nemo_run/code/recipes/multimodal/server/tool_calling/nemotron_v2_voicechat_toolcall_parser.py
  --chat_template /nemo_run/code/recipes/multimodal/server/tool_calling/nano_v2_voicechat_toolcalling_chat_template.jinja
  --code_path /lustre/fsw/portfolios/llmservice/users/yuanhangs/codes/NeMo/NeMo_Voice_Chat_DRIRF
  --pip_install "--cache-dir /lustre/fsw/portfolios/llmservice/users/yuanhangs/cache/pip hf-xet==1.1.9 huggingface-hub==0.34.4 nvidia-modelopt==0.33.1 nvidia-modelopt-core==0.33.1 tokenizers==0.22.0 transformers==4.56.0 lhotse==1.32.2 nv-one-logger-core==2.1.0 nv-one-logger-pytorch-lightning-integration==2.1.0 nv-one-logger-training-telemetry==2.1.0 kaldialign==0.9.1 langchain-core"

server_container: /lustre/fsw/portfolios/llmservice/users/erastorgueva/code/containers/triton25.05_s2svllm26.02.12.sqsh
scoring_container: /lustre/fsw/portfolios/convai/users/ecasanova/docker_images/nemo_duplex_november_eartts.sqsh
scoring_container_python_exec: python3

scoring_gpus: 1
scoring_partition: batch_block1,batch_block3,batch_block4

server_server_type: vllm_multimodal

# fdb_repo_path is UNUSED by this variant (every CHENCHEN touchpoint is
# overridden below: tool spec, system prompt, scoring evaluators, mock-API impl,
# and the scoring input data). Pointed at the official data dir so no CHENCHEN
# path appears in the config; run_scoring only uses it to derive defaults we
# override, so its value is never read.
fdb_repo_path: /lustre/fsw/portfolios/llmservice/users/yuanhangs/codes/FDBV3_CHENCHEN

# === Official overrides: faithful to github.com/DanielLin94144/Full-Duplex-Bench v3 ===
# Generation reuses fdb_v3's prepared user audio (byte-identical NTU recordings;
# no re-prepare), and the OFFICIAL prompt + tools are injected at generation time
# (precedence: config > test.jsonl), so the model sees the official tool-calling
# contract rather than the CHENCHEN one.
benchmark: fdb_v3.tool_call
benchmark_key: fdb_v3_official.tool_call

# Official tool spec (OpenAI format, derived from lk_agent_tool.py) + official
# system prompt (VoiceAgent.instructions). Absolute /nemo_run/code paths (read by
# the generation task in-container), matching the server_args convention.
# IMPORTANT: server_args must NOT include --no_pre_baked_system_prompt here.
# That flag makes the server drop the client system prompt (unified_server.py:660)
# and render only the tools, which would silently discard the official VoiceAgent
# instructions. The in-tree fdb_v3 config keeps that flag on purpose (its prompt is
# tool-only); the official variant must keep it OFF so the official prompt renders.
tool_spec_path: /nemo_run/code/nemo_skills/dataset/fdb/scripts/fdb_v3_official/assets/fd3_tool_spec_official.json
system_prompt_path: /nemo_run/code/nemo_skills/dataset/fdb/scripts/fdb_v3_official/assets/system_prompt_official.txt

# Official scoring evaluators + benchmark (resolved against scoring cwd /nemo_run/code).
# Scoring input audio (user-speech timing / latency): the officially-downloaded
# fdb_v3_data_released/ (gdown of the README's Google-Drive file). No CHENCHEN.

# Mock tool RESPONSES: official mock_apis.py via the generalized DRIRF dispatch
# (FDB_MOCK_API_IMPL). Forwarded to the generation env by run_eval's mock_api opt-in.
mock_api_impl: /nemo_run/code/nemo_skills/dataset/fdb/scripts/fdb_v3_official/mock_api/fd3_mock_execute.py

backend_agent:
  model: "mock_api"

stop_at_last_turn: true
stop_at_last_turn_quiet_window_sec: 10.0

data_dir: /lustre/fsw/portfolios/llmservice/users/yuanhangs/data/fdb
output_dir: /lustre/fsw/portfolios/llmservice/users/yuanhangs/workspace/voice_chat/sampling+greedy/greedy/e165_v2-step19608-tts-eartts-no_bw_reb_56k_12ksteps_fake_rnnt/fdb_v3_scoring_matrix/exp08_official_chenchen_gpt52

provider: fdb_v3_official_fc_greedy
expname: exp08_official_chenchen_gpt52

# LLM judge: gpt-4o (official benchmark's judge), routed through the NVIDIA
# gateway by the vendored scripts' _nv_judge helper (defaults to
# azure/openai/gpt-4o, key from NV_INFERENCE_KEY -> NVIDIA_API_KEY set by
# run_scoring.py). Override the model via FD3_JUDGE_MODEL if needed.
use_llm_judge: true
skip_latency: false

installation_command: "mkdir -p /usr/local/lib/python3.12/dist-packages/vllm/model_executor/models && cp /nemo_run/code/asset/nemotron_h.py /usr/local/lib/python3.12/dist-packages/vllm/model_executor/models/nemotron_h.py"
scoring_installation_command: "pip install --cache-dir /lustre/fsw/portfolios/llmservice/users/yuanhangs/cache/pip numpy scipy scikit-learn soundfile pydub openai jinja2"

inference_overrides: ""

generation_only: false
dry_run: false
