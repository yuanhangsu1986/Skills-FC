# Full-Duplex-Bench v3 (FD3) — UPSTREAM end-to-end variant.
#
# Drives the upstream FD3 orchestrator (Backend_agent + vLLM serving
# Qwen3-30B-A3B-Instruct + S2S via cchen1's NemotronVoicechatInferenceWrapper)
# on a single 2-GPU node. Scoring just ingests the upstream reports into our
# metrics.json schema under key fdb_v3_chen_chen.tool_call.
#
# All code/data lives under a yuanhangs-owned mirror (fdb_repo_path below);
# only the upstream container .sqsh remains external.
#
# Use this when you want numbers comparable to upstream FDBV3 reports.
# For the in-tree variant (DSFTS inference + custom scoring), see ../fdb_v3/.

cluster: s2s_eval_oci_iad_oncluster
partition: batch_block1,batch_block3,batch_block4
# Scoring is pure JSON shuffling — route it to a CPU partition since the GPU
# partition rejects 0-GPU job requests.
cpu_partition: cpu_short

# 2 GPUs on one node: orchestrator pins Backend GPU=0 (vLLM) and S2S GPU=1.
num_gpus: 2

# REQUIRED: the S2S checkpoint to evaluate.
# Use the `model:` key (not `s2s_checkpoint_dir:`) so scripts/run_all_benchmarks.sh
# `make_patched_config` can rewrite it when --model is given globally.
model: /lustre/fsw/portfolios/llmservice/users/vtrinh/projects/function_calling_share/pretrained_s2s_rnnt_ckpt/Apr_02_2026/e70/e70-step28008-tts-eartts-34014_asr_cand3_0.6b-PK_ep0_01988_300

# NeMo source on PYTHONPATH — yuanhangs-owned mirror of cchen1's Backend_agent/NeMo
# fork (where chen chen's run_s2s_offline_benchmark.py was developed against).
# This is intentionally NOT DRIRF: cchen1's wrapper has its own FC state-machine /
# _do_fc_prefill / get_fc_debug_counters logic that DRIRF replaced with a different
# implementation. Using DRIRF here causes the model to emit pure PAD/EOS tokens
# even though the system prompt, audio, and cuda-graph fixes are all correct.
nemo_code_path: /lustre/fsw/portfolios/llmservice/users/yuanhangs/codes/NeMo/NeMo_Voice_Chat_Chen_Chen

# Self-contained yuanhangs-owned mirror of upstream's FD3 + Backend_agent.
# Contains: FD3/bin/run_fd3_audio_eval_job.sh, FD3/bin/run_fd3_eval.sh,
# FD3/release_code/{run_s2s_offline_benchmark.py, evaluators...},
# FD3/fdb_v3_data_released/<100 samples with input.wav>,
# Backend_agent/{setup_llm.sh, start_backend_agent.sh, langGraph/} —
# the inner Backend_agent Python package was copied from cchen1's tree
# (the only piece that wasn't in the FDBV3 release).
fdb_repo_path: /lustre/fsw/portfolios/llmservice/users/yuanhangs/codes/NeMo/FDBV3_CHENCHEN

# Container with all upstream deps (lightning, vllm, NeMo, etc.).
server_container: /lustre/fsw/portfolios/llmservice/users/cchen1/containers/eval_agent.sqsh
scoring_container: /lustre/fsw/portfolios/llmservice/users/cchen1/containers/eval_agent.sqsh
scoring_container_python_exec: python3

# No custom mounts. fdb_repo_path above is yuanhangs-owned and writable, so
# all upstream artifacts (logs, reports, per-sample results) land there. The
# cluster default /lustre:/lustre is sufficient.

# Benchmark-specific env vars. Cache locations and HF_TOKEN are owned by the
# cluster YAML. This dict carries only FD3-specific knobs: auth for the judge,
# judge model name, etc.
#
# IMPORTANT: do NOT set VLLM_API_KEY. vLLM picks it up automatically and
# enforces it as a bearer token; the orchestrator's wait_for_http health check
# (curl -sf .../v1/models) doesn't pass any auth, so setting VLLM_API_KEY
# makes the check loop on 401. Upstream sidesteps this by never setting it
# (Backend_agent/setup_llm.sh launches vLLM without --api-key). graph_fd3.py
# then reads NVIDIA_API_KEY as the OpenAI-client api_key — vLLM accepts any
# value since auth isn't enforced.
env:
  OPENAI_BASE_URL: https://inference-api.nvidia.com/v1
  OPENAI_API_KEY: ${NV_INFERENCE_KEY:-}
  NVIDIA_API_KEY: ${NV_INFERENCE_KEY:-}
  FD3_JUDGE_MODEL: openai/openai/gpt-5.2
  JUDGE_MODEL: openai/openai/gpt-5.2
  # ASR model used by chen chen's run_tool_benchmark.run_asr on the agent
  # output WAV. Configurable; default is the upstream choice.
  ASR_MODEL_NAME: nvidia/parakeet-tdt-0.6b-v2
  # Disable RNN-T CUDA-graph decoding. NeMo's CUDA-graph path unpacks
  # cudaStreamGetCaptureInfo's return as a 7-tuple (cu_call strips error to 6),
  # but this container's cuda.bindings.runtime returns 6 elements (5 after
  # strip). Symptom: "ValueError: not enough values to unpack (expected 6, got
  # 5)" raised from super().transcribe(...) when timestamps=True. Disabling
  # CUDA graphs skirts the affected code path.
  ASR_DISABLE_CUDA_GRAPHS: "1"

# Output: eval-results/<benchmark>/ holds metrics.json + summarized-results/.
# eval-results/<benchmark>/fd3_run/ holds upstream artifacts
# (reports/, logs/, per_sample_results/, model_report.json).
output_dir: /lustre/fsw/portfolios/llmservice/users/yuanhangs/workspace/voice_chat_chen_chen/fdb_v3_chen_chen
provider: fdb_v3_chen_chen
expname: fdb_v3_chen_chen

# System prompt: by default, render the same Nano v2 (full-schema with
# <TOOLCALL> framing) system prompt the in-tree fdb_v3 pipeline uses, via
# fdb_v3/render_prompt.py:render_fd3_system_prompt. Empirically required for
# S2S checkpoints fine-tuned on the Nano v2 chat template — the upstream
# lightweight (name+description only) default makes them emit pure PAD tokens.
#
# To use upstream's lightweight prompt instead (e.g. to reproduce published
# FD3 baselines), set `render_fd3_system_prompt: false`. To use a custom
# prompt, put it under `env: FD3_S2S_SYSTEM_PROMPT: ...` and our render is
# skipped automatically.
render_fd3_system_prompt: true

# Inference knobs forwarded to run_s2s_offline_benchmark.py.
#
# engine_type=native uses the wrapper's PyTorch path — slower than vLLM but reliable.
# The wrapper's vLLM-EARTTS conversion (convert_eartts_checkpoint) is fragile
# and crashes on some checkpoint formats (e.g. `_fake_rnnt` variants) with
# "There is no module or parameter named 'stt_model' in NemotronHForCausalLM".
# Conv_behav's drirf_offline pipeline rejects vllm engine_types entirely
# (conv_behav_drirf_offline_infer.py:59-62) for the same reason, so `native`
# is the supported path.
engine_type: native
temperature: 0.0
top_p: 1.0

# Limit examples for smoke tests (null = full 100-sample run).
max_examples: null

# Scoring stage is pure JSON shuffling — no GPU needed.
scoring_gpus: 0

# Container-specific shell snippet executed before the orchestrator. Use this
# for setup that depends on the container layout (PATH fixups, symlinks,
# module sourcing, etc.). Leave empty to assume nothing.
#
# Example for cchen1's eval_agent.sqsh: the container ships only `python3`,
# but Backend_agent/start_backend_agent.sh invokes `python`. Their sbatch
# wrapper papers over this with a symlink:
#   pre_command: 'ln -sf "$(which python3)" /usr/local/bin/python 2>/dev/null || true'
pre_command: 'ln -sf "$(which python3)" /usr/local/bin/python 2>/dev/null || true'

# Pre-flight installs (mostly already in the container; left empty by default).
installation_command: ""
scoring_installation_command: ""

# Lifecycle flags.
generation_only: false
scoring_only: false
dry_run: false
force: false
