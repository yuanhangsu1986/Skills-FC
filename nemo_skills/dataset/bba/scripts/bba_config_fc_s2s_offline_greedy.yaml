# BigBench Audio evaluation - S2S OFFLINE backend, FC checkpoint.
# Greedy decoding (temperature=0).
#
# Mirrors bba_config_fc_s2s_incremental_v2_greedy.yaml but routes generation
# through the offline DSFTS codebase + nemo_duplex container.  Audio is
# generated (--decode_audio) so the downstream BBA ASR + LLM-judge scoring
# stages still have audio to consume.
#
# Run:
#   python nemo_skills/dataset/bba/scripts/run_bba_eval.py \
#     --config nemo_skills/dataset/bba/scripts/bba_config_fc_s2s_offline_greedy.yaml

cluster: s2s_eval_oci_iad_oncluster
partition: batch_block1,batch_block3,batch_block4
cpu_partition: cpu_short

model: /lustre/fsw/portfolios/llmservice/users/vtrinh/projects/function_calling_share/pretrained_s2s_rnnt_ckpt/Apr_02_2026/e70/e70-step28008-tts-eartts-34014_asr_cand3_0.6b-PK_ep0_01988_300

server_type: vllm
server_gpus: 1
num_chunks: 4

server_entrypoint: "-m nemo_skills.inference.server.serve_unified"
server_args: >-
  --backend s2s_voicechat
  --decode_audio
  --config_path /lustre/fsw/portfolios/llmservice/users/yuanhangs/codes/Skills-FC/nemo_skills/dataset/bba/scripts/infer_nano_eartts_Voicebench_Jan22_2026.yaml
  --speaker_reference /lustre/fsw/portfolios/nemotron/projects/nemotron_speech_chat/users/ecasanova/Checkpoints/Mg_a_00759.wav
  --tts_ckpt_path /lustre/fsw/portfolios/nemotron/projects/nemotron_speech_chat/users/ecasanova/Checkpoints/Duplex_EARTTS/eartts_rvq_cont_task_nanov2_tts_pretraining_wordlist_duplex_data_new_branch_4nodes_duplex_eartts_2_delay_4rd_stage_fp32_wd_1500_et_eos_dp_eos_dup_step_10004.ckpt
  --extra_decoding_seconds 20
  --dtype float32
  --temperature 0.0
  --top_p 1.0
  --repetition_penalty 1.0
  --force_turn_taking
  --code_path /lustre/fsw/portfolios/llmservice/users/yuanhangs/codes/NeMo/NeMo_Voice_Chat_DSFTS

server_container: /lustre/fsw/portfolios/llmservice/projects/llmservice_nemo_mlops/full-duplex/containers/nemo_duplex_november_eartts.sqsh
server_server_type: vllm_multimodal

# Paths - run prepare.py once to populate data_dir
data_dir: /lustre/fsw/portfolios/llmservice/users/yuanhangs/workspace/voice_chat/bba_data
output_dir: /lustre/fsw/portfolios/llmservice/users/yuanhangs/workspace/voice_chat_offline_greedy/bba_fc

categories:
  - formal_fallacies
  - navigate
  - object_counting
  - web_of_lies

installation_command: ""
asr_installation_command: ""
scoring_installation_command: ""

# ASR settings (following official BBA evaluation methodology)
asr_model: openai/whisper-large-v3
asr_server_args: "--task transcription"
asr_server_gpus: 1

# LLM-as-judge (Claude Sonnet via NVIDIA inference API)
judge_model: aws/anthropic/bedrock-claude-sonnet-4-6
api_type: nvidia
judge_base_url: "https://inference-api.nvidia.com/v1"

system_message: "Answer the question with a single word."

inference_overrides: "++inference.temperature=0.0 ++inference.top_p=1.0 ++inference.repetition_penalty=1.0 ++inference.tokens_to_generate=1024"

temperature: 0.0
top_p: 1.0
repetition_penalty: 1.0
force_turn_taking: true

scoring_container_python_exec: python3
expname: bba_fc_offline_greedy
# max_samples: 50

generation_only: false
scoring_only: false
dry_run: false
