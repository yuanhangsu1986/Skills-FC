# conv_behav evaluation — greedy decoding
#
# Uses temperature=0.0, force_turn_taking=true.  Matches the greedy setting
# used across BBA / VB / FDB / BFCL greedy configs.
#
# Run:
#   python nemo_skills/dataset/conv_behav/scripts/run_eval.py \
#     --config nemo_skills/dataset/conv_behav/scripts/conv_behav_config_greedy.yaml

# ---------------------------------------------------------------------------
# Cluster
# ---------------------------------------------------------------------------
cluster: s2s_eval_oci_iad_oncluster
partition: batch_block1,batch_block3,batch_block4

# ---------------------------------------------------------------------------
# Model — vtrinh combined checkpoint (HF format).
# model_path provides TTS weights; llm_checkpoint_path provides LLM+perception
# weights.  For a combined checkpoint both paths point to the same directory.
# ---------------------------------------------------------------------------
model: /lustre/fsw/portfolios/llmservice/users/vtrinh/projects/function_calling_share/pretrained_s2s_rnnt_ckpt/Apr_02_2026/e70/e70-step28008-tts-eartts-34014_asr_cand3_0.6b-PK_ep0_01988_300
llm_checkpoint_path: /lustre/fsw/portfolios/llmservice/users/vtrinh/projects/function_calling_share/pretrained_s2s_rnnt_ckpt/Apr_02_2026/e70/e70-step28008-tts-eartts-34014_asr_cand3_0.6b-PK_ep0_01988_300

# ---------------------------------------------------------------------------
# NeMo codebase — vtrinh's NeMo2 repo on the cluster.
# Used by run_inference.py (RealtimeStreamingInference) and run_scoring.py.
# ---------------------------------------------------------------------------
nemo_code_path: /lustre/fsw/portfolios/llmservice/users/vtrinh/projects/s2s_Feb_21_2026/code/eval_turn_taking/NeMo2

# ---------------------------------------------------------------------------
# Speaker reference for TTS voice cloning
# ---------------------------------------------------------------------------
speaker_reference: /lustre/fsw/portfolios/convai/users/ecasanova/Checkpoints/Mg_a_00759.wav

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
shar_input_dir: /lustre/fsw/portfolios/llmservice/users/kevinhu/data/team_20251124
dataset_name: team_20251124

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output_dir: /lustre/fsw/portfolios/llmservice/users/yuanhangs/workspace/voice_chat_greedy/conv_behav

# ---------------------------------------------------------------------------
# Streaming inference parameters (named args in run_inference.py)
# ---------------------------------------------------------------------------
num_frames_per_inference: 3
buffer_size_frames: 21
codec_token_history_size: 60

# ---------------------------------------------------------------------------
# Inference — extra args applied as OmegaConf overrides on engine.model.cfg
# after initialization.  force_turn_taking=true for greedy.
# ---------------------------------------------------------------------------
inference_args: >-
  --force_turn_taking true
  --temperature 0.0
  --top_p 1.0
  --repetition_penalty 1.0
  --use_codec_cache
  --use_perception_cache
  --inference_pad_boost 0
  --inference_bos_boost 0
  --inference_eos_boost 0
  --inference_user_pad_boost 0
  --inference_user_bos_boost 0
  --inference_user_eos_boost 0
  --inference_guidance_scale 0.2
  --inference_top_p_or_k 0.95
  --inference_noise_scale 0.001

# ---------------------------------------------------------------------------
# Scoring thresholds
# ---------------------------------------------------------------------------
barge_in_threshold_sec: 1.5
tt_latency_threshold_sec: 1.5
tt_precision_buffer_sec: 1.0
tt_recall_buffer_sec: 20.0
vad_min_silence_duration_ms: 2000
scoring_gpus: 1

# ---------------------------------------------------------------------------
# Containers
# ---------------------------------------------------------------------------
inference_container: /lustre/fsw/portfolios/convai/users/ecasanova/docker_images/nemo_duplex_november_eartts.sqsh
# scoring_container: ???   # defaults to inference_container

# ---------------------------------------------------------------------------
# Installation commands
# ---------------------------------------------------------------------------
# installation_command: ""
scoring_installation_command: "pip install numpy scipy scikit-learn silero-vad soundfile"

# ---------------------------------------------------------------------------
# Pipeline control
# ---------------------------------------------------------------------------
expname: conv_behav_greedy
inference_only: false
scoring_only: false
scoring_force: false
dry_run: false
