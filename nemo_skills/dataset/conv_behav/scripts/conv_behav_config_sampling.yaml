# conv_behav evaluation — sampling decoding
#
# Uses force_turn_taking=false (model decides turn-taking).  Matches the
# sampling setting used across BBA / VB / FDB / BFCL sampling configs.
#
# Run:
#   python nemo_skills/dataset/conv_behav/scripts/run_eval.py \
#     --config nemo_skills/dataset/conv_behav/scripts/conv_behav_config_sampling.yaml

# ---------------------------------------------------------------------------
# Cluster
# ---------------------------------------------------------------------------
cluster: s2s_eval_oci_iad_oncluster
partition: batch_block1,batch_block3,batch_block4

# ---------------------------------------------------------------------------
# Model — HuggingFace-format checkpoint directory (produced by to_hf.py).
# Must contain config.json + model weights.
# ---------------------------------------------------------------------------
model: /lustre/fsw/portfolios/llmservice/users/vtrinh/projects/function_calling_share/pretrained_s2s_rnnt_ckpt/Apr_02_2026/e70/e70-step28008-tts-eartts-34014_asr_cand3_0.6b-PK_ep0_01988_300

# ---------------------------------------------------------------------------
# NeMo codebase paths.
#
# inference_nemo_code_path:  vtrinh's NeMo2 root (post-Feb-2026 checkout with
#                            s2s_duplex_stt_infer.py + nemotron_voicechat).
# nemo_code_path:            kevinhu's NeMo root for scoring only.
# ---------------------------------------------------------------------------
inference_nemo_code_path: /lustre/fsw/portfolios/llmservice/users/vtrinh/projects/s2s_Feb_21_2026/code/NeMo2-merge/NeMo2-private_tts_fix_Mar_20
inference_config_path: /lustre/fsw/portfolios/llmservice/users/vtrinh/projects/s2s_Feb_21_2026/config/inference
inference_config_name: infer_nano_9b_team_20251124_s2t
nemo_code_path: /lustre/fsw/portfolios/llmservice/users/kevinhu/s2s/NeMo

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
shar_input_dir: /lustre/fsw/portfolios/llmservice/users/kevinhu/data/team_20251124
dataset_name: team_20251124

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output_dir: /lustre/fsw/portfolios/llmservice/users/yuanhangs/workspace/voice_chat_sampling/conv_behav

# ---------------------------------------------------------------------------
# Inference settings
# ---------------------------------------------------------------------------
num_gpus: 8
num_nodes: 1
force_turn_taking: false

# ---------------------------------------------------------------------------
# Scoring thresholds
# ---------------------------------------------------------------------------
barge_in_threshold_sec: 1.5
tt_latency_threshold_sec: 1.5
tt_precision_buffer_sec: 1.0
tt_recall_buffer_sec: 20.0
vad_min_silence_duration_ms: 2000
scoring_gpus: 1

# ---------------------------------------------------------------------------
# Containers
# ---------------------------------------------------------------------------
inference_container: /lustre/fsw/portfolios/convai/users/ecasanova/docker_images/nemo_duplex_november_eartts.sqsh
# scoring_container: ???   # defaults to inference_container

# ---------------------------------------------------------------------------
# Installation commands
# ---------------------------------------------------------------------------
# installation_command: ""
scoring_installation_command: "pip install numpy scipy scikit-learn silero-vad soundfile"

# ---------------------------------------------------------------------------
# Pipeline control
# ---------------------------------------------------------------------------
expname: conv_behav_sampling
inference_only: false
scoring_only: false
scoring_force: false
dry_run: false
