# conv_behav evaluation — greedy decoding (force_turn_taking=true)
#
# Run:
#   python nemo_skills/dataset/conv_behav/scripts/run_eval.py \
#     --config nemo_skills/dataset/conv_behav/scripts/conv_behav_incremental_config_greedy.yaml

# ---------------------------------------------------------------------------
# Cluster
# ---------------------------------------------------------------------------
cluster: s2s_eval_oci_iad_oncluster
partition: batch_block1,batch_block3,batch_block4

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------
model: /lustre/fs11/portfolios/edgeai/projects/edgeai_riva_rivamlops/users/vtrinh/projects/s2s_Feb_21_2026/result/noASR_e70_from_PT_49k_64gpu_5e-5_PT0.5_SFT0.15_QA0.02_TEXT0.1_loss0.5_MCQ0.03_prompt2_ASR0.0_sysp0.05_NoiseDefault_asr_dtc2_dst15_lossDefault_ei0.033_ot8_all_data_v3.2/checkpoints/step-28008_hf

# ---------------------------------------------------------------------------
# NeMo codebase paths
#   nemo_code_path: used for inference.
#   scoring_nemo_code_path: used for scripts/speech_eval/eval_conversation_behavior.py.
# ---------------------------------------------------------------------------
nemo_code_path: /lustre/fsw/portfolios/llmservice/users/yuanhangs/codes/NeMo/NeMo_Voice_Chat_DRIRF
scoring_nemo_code_path: /lustre/fsw/portfolios/llmservice/users/yuanhangs/codes/NeMo/NeMo_Voice_Chat_DSFTS
pretrained_llm: nvidia/NVIDIA-Nemotron-Nano-9B-v2

# Used only by pipeline_mode=drirf_incremental. The script delegates model building,
# checkpoint loading, and frame-level inference to DRIRF's s2s_incremental_v2
# backend, then writes the conv_behav validation_logs output contract.
drirf_incremental_inference_script_path: /nemo_run/code/nemo_skills/dataset/conv_behav/scripts/conv_behav_drirf_incremental_infer.py
inference_config_path: /lustre/fsw/portfolios/llmservice/users/vtrinh/projects/s2s_Feb_21_2026/config/inference
inference_config_name: infer_nano_9b_team_20251124_s2t

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
shar_input_dir: /lustre/fsw/portfolios/llmservice/users/kevinhu/data/team_20251124
dataset_name: team_20251124
benchmark: conv_behav.team_20251124
data_dir: /lustre/fsw/portfolios/llmservice/users/yuanhangs/data/conv_behav

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output_dir: /lustre/fsw/portfolios/llmservice/users/yuanhangs/workspace/voice_chat_greedy/conv_behav

# ---------------------------------------------------------------------------
# Inference settings
# ---------------------------------------------------------------------------
num_gpus: 1       # set to 8 for 8-GPU DDP (torchrun is used automatically)
num_nodes: 1
force_turn_taking: true
force_turn_taking_threshold: 40
force_turn_taking_pad_window: 25

# drirf_offline uses the wrapper-backed native Lightning validation adapter.
# drirf_incremental and nemo_eval use the DRIRF s2s_incremental_v2/serve_unified
# knobs below.
speaker_reference: /lustre/fsw/portfolios/convai/users/ecasanova/Checkpoints/Mg_a_00759.wav
drirf_offline_engine_type: native
num_frames_per_inference: 3
buffer_size_frames: 21
codec_token_history_size: 60
engine_type: vllm_llm_vllm_eartts
use_perception_cache: true
use_perception_cudagraph: true
use_codec_cache: true
# Opt-in workaround for DRIRF containers where RNNT streaming decode hits a
# cuda-python CUDA-graph return-value mismatch. Keep this false/absent for
# backend configs that do not need it.
disable_rnnt_decoder_cuda_graphs: true
matmul_precision: medium
vllm_gpu_memory_utilization: 0.35
vllm_max_model_len: 8192
inference_user_pad_boost: 0.8
silence_padding_sec: 0
max_new_tokens: 4500

# Decoding knobs.
temperature: 0.0
top_p: 1.0
repetition_penalty: 1.0

# TTS classifier-free-guidance / sampling knobs (s2s_incremental_v2 backend).
# Leave commented to use checkpoint defaults; set explicit values to override.
# These flow through build_drirf_incremental_inference_command into
# conv_behav_drirf_incremental_infer.py and onto S2SIncrementalV2Config.
inference_guidance_scale: 0.2
inference_top_p_or_k: 0.95
inference_noise_scale: 0.001
tts_sliding_window: 7500

# HuggingFace cache dir (avoids re-downloading weights on each job)
hf_home: /lustre/fsw/portfolios/llmservice/users/yuanhangs/cache/huggingface

# PyTorch hub cache dir — must contain hub/snakers4_silero-vad_master.
# When the cache exists, torch.hub skips the GitHub API validation call entirely,
# avoiding rate-limit errors on compute nodes without internet access.
# Run once to populate: cp -r ~/.cache/torch/hub/snakers4_silero-vad_master \
#   /lustre/fsw/portfolios/llmservice/users/yuanhangs/cache/torch/hub/
torch_home: /lustre/fsw/portfolios/llmservice/users/yuanhangs/cache/torch

# ---------------------------------------------------------------------------
# Scoring thresholds
# ---------------------------------------------------------------------------
barge_in_threshold_sec: 1.5
tt_latency_threshold_sec: 1.5
tt_precision_buffer_sec: 1.0
tt_recall_buffer_sec: 20.0
vad_min_silence_duration_ms: 2000
scoring_gpus: 1

# ---------------------------------------------------------------------------
# Containers
# ---------------------------------------------------------------------------
# Inference uses the DRIRF/incremental runtime; scoring uses the DSFTS/offline
# runtime because eval_conversation_behavior.py lives in the DSFTS tree.
inference_container: /lustre/fsw/portfolios/llmservice/users/erastorgueva/code/containers/triton25.05_s2svllm26.02.12.sqsh
inference_container_python_exec: python3
scoring_container: /lustre/fsw/portfolios/convai/users/ecasanova/docker_images/nemo_duplex_november_eartts.sqsh
scoring_container_python_exec: python3

# ---------------------------------------------------------------------------
# Installation commands
# ---------------------------------------------------------------------------
installation_command: "python3 -m pip install hf-xet==1.1.9 huggingface-hub==0.34.4 nvidia-modelopt==0.33.1 nvidia-modelopt-core==0.33.1 tokenizers==0.22.0 transformers==4.56.0 lhotse==1.32.2 soundfile nv-one-logger-core==2.1.0 nv-one-logger-pytorch-lightning-integration==2.1.0 nv-one-logger-training-telemetry==2.1.0 kaldialign==0.9.1 && mkdir -p /usr/local/lib/python3.12/dist-packages/vllm/model_executor/models && cp /nemo_run/code/asset/nemotron_h.py /usr/local/lib/python3.12/dist-packages/vllm/model_executor/models/nemotron_h.py"
scoring_installation_command: "python3 -m pip install numpy scipy scikit-learn soundfile openai jiwer whisper-normalizer"

# ---------------------------------------------------------------------------
# Pipeline control
# ---------------------------------------------------------------------------
expname: conv_behav_greedy
pipeline_mode: drirf_incremental
inference_only: false
generation_only: false
scoring_only: false
scoring_force: false
dry_run: false
