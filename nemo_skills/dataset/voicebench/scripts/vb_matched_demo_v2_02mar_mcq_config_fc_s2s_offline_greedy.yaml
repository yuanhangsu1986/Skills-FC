# VoiceBench evaluation - (iii) MATCHED_DEMO_V2 setup - MCQ subtests
# S2S OFFLINE backend (s2s), FC checkpoint, greedy decoding (temperature=0).
# MCQ datasets (bbh, openbookqa, mmsu) require a system prompt.
#
# Mirrors vb_matched_demo_v2_02mar_mcq_config_fc_s2s_incremental_v2_greedy.yaml
# but swaps in the offline DSFTS codebase + nemo_duplex container.
#
# Run:
#   python nemo_skills/dataset/voicebench/scripts/generate_from_api_and_score_official.py \
#     --config nemo_skills/dataset/voicebench/scripts/vb_matched_demo_v2_02mar_mcq_config_fc_s2s_offline_greedy.yaml

# Cluster settings
cluster: s2s_eval_oci_iad_oncluster
partition: batch_block1,batch_block3,batch_block4
cpu_partition: cpu_short

model: /lustre/fsw/portfolios/llmservice/users/vtrinh/projects/function_calling_share/pretrained_s2s_rnnt_ckpt/Apr_02_2026/e70/e70-step28008-tts-eartts-34014_asr_cand3_0.6b-PK_ep0_01988_300

server_type: vllm
server_gpus: 1
num_chunks: 12

server_entrypoint: "-m nemo_skills.inference.server.serve_unified"
server_args: >-
  --backend s2s
  --config_path /lustre/fsw/portfolios/llmservice/users/kevinhu/projects/duplex-stt/config/inference/infer_nano_eartts_Voicebench_Jan22_2026.yaml
  --speaker_reference /lustre/fsw/portfolios/convai/users/ecasanova/Checkpoints/Mg_a_00759.wav
  --tts_ckpt_path /lustre/fsw/portfolios/convai/users/ecasanova/Checkpoints/Duplex_EARTTS/eartts_rvq_cont_task_nanov2_tts_pretraining_wordlist_duplex_data_new_branch_4nodes_duplex_eartts_2_delay_4rd_stage_fp32_wd_1500_et_eos_dp_eos_dup_step_10004.ckpt
  --extra_decoding_seconds 20
  --dtype float32
  --temperature 0.0
  --top_p 1.0
  --repetition_penalty 1.0
  --force_turn_taking
  --system_prompt "Answer the following multiple choice question with an explanation for the answer."
  --code_path /lustre/fsw/portfolios/llmservice/users/yuanhangs/codes/NeMo/NeMo_Voice_Chat_DSFTS

# server_container: /lustre/fsw/portfolios/convai/users/ecasanova/docker_images/nemo_duplex_november_eartts.sqsh
server_container: /lustre/fsw/portfolios/llmservice/projects/llmservice_nemo_mlops/full-duplex/containers/nemo_duplex_november_eartts.sqsh
server_server_type: vllm_multimodal

# Paths
data_dir: /lustre/fsw/portfolios/convai/users/mmkrtchyan/projects/speechLM/s2s/voicebench_data_dir
output_dir: /lustre/fsw/portfolios/llmservice/users/yuanhangs/workspace/voice_chat_offline_greedy/vb_mcq
voicebench_repo_path: /lustre/fsw/portfolios/llmservice/users/vmendelev/code/VoiceBench

subtests:
  - bbh
  - openbookqa
  - mmsu

# Scoring settings (text-only; offline s2s backend doesn't decode audio)
api_type: nvidia
nvidia_model: azure/openai/gpt-4o-mini

installation_command: ""
scoring_installation_command: "pip install --cache-dir /lustre/fsw/portfolios/llmservice/users/yuanhangs/cache/pip sacrebleu qa_metrics"

inference_overrides: "++inference.temperature=0.0 ++inference.top_p=1.0 ++inference.repetition_penalty=1.0 ++inference.tokens_to_generate=1024"

temperature: 0.0
top_p: 1.0
repetition_penalty: 1.0
force_turn_taking: true

expname: vb_matched_demo_v2_02mar_mcq_fc_offline_greedy

generation_only: false
scoring_only: false
dry_run: false
