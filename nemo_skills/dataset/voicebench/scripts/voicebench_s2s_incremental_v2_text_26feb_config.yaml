# (P0) VoiceBench evaluation - S2S incremental V2 backend, TEXT output only.
# No audio decoding -- faster inference, text-only scoring.
# Uses NemotronVoicechatInferenceWrapper with vLLM + perception cache.
# Checkpoint: Feb 26 2026 (legally friendly personaplex dataset)
#
# Run:
#   python nemo_skills/dataset/voicebench/scripts/generate_from_api_and_score_official.py \
#     --config nemo_skills/dataset/voicebench/scripts/voicebench_s2s_incremental_v2_text_26feb_config.yaml

# Cluster settings
cluster: s2s_eval_oci_iad
partition: batch_block1,batch_block3,batch_block4
cpu_partition: cpu

model: /lustre/fsw/portfolios/convai/users/ecasanova/Checkpoints/Nemotron-VoiceChat-november/duplex-eartts-10min_sw_et_eos_dp_eos_dup_fp32_1delay_26_Feb_exp_13_afg_14k_steps-stt-AS9.1_11002_new_branch_load_fixed

server_type: vllm
server_gpus: 1
num_chunks: 48

server_entrypoint: "-m nemo_skills.inference.server.serve_unified"
server_args: >-
  --backend s2s_incremental_v2
  --no_decode_audio
  --speaker_reference /lustre/fsw/portfolios/convai/users/ecasanova/Checkpoints/Mg_a_00759.wav
  --num_frames_per_inference 3
  --engine_type vllm_llm_vllm_eartts
  --use_perception_cache
  --use_perception_cudagraph
  --buffer_size_frames 20
  --codec_token_history_size 60
  --pad_to_duration_secs 40
  --repetition_penalty 1.0
  --force_turn_taking
  --force_turn_taking_threshold 40
  --force_turn_taking_pad_window 25
  --matmul_precision medium
  --vllm_gpu_memory_utilization 0.35
  --vllm_max_model_len 8192
  --system_prompt "You are an AI assistant developed by NVIDIA. Your name is NVIDIA VoiceChat. Your job is to be helpful and have engaging conversations in English. Maintain a warm tone. Keep the dialogue open and ongoing. You must provide diverse responses, rephrase answers if user asks the same questions."
  --output_dir /lustre/fsw/portfolios/convai/users/mmkrtchyan/projects/speechLM/s2s/FEB_26/voicebench_incremental_v2_text_26feb_artifacts
  --batch_size 2
  --code_path /lustre/fsw/portfolios/convai/users/mmkrtchyan/projects/speechLM/s2s/NeMo
  --pip_install "--cache-dir /lustre/fsw/portfolios/llmservice/users/yuanhangs/cache/pip hf-xet==1.1.9 huggingface-hub==0.34.4 nvidia-modelopt==0.33.1 nvidia-modelopt-core==0.33.1 tokenizers==0.22.0 transformers==4.56.0 lhotse==1.32.2 nv-one-logger-core==2.1.0 nv-one-logger-pytorch-lightning-integration==2.1.0 nv-one-logger-training-telemetry==2.1.0 kaldialign==0.9.1"

server_container: /lustre/fsw/portfolios/llmservice/users/erastorgueva/code/containers/triton25.05_s2svllm26.02.12.sqsh
server_server_type: vllm_multimodal

# Paths
data_dir: /lustre/fsw/portfolios/convai/users/mmkrtchyan/projects/speechLM/s2s/voicebench_data_dir
output_dir: /lustre/fsw/portfolios/convai/users/mmkrtchyan/projects/speechLM/s2s/FEB_26/voicebench_incremental_v2_text_26feb
voicebench_repo_path: /lustre/fsw/portfolios/llmservice/users/vmendelev/code/VoiceBench

subtests:
  - sd_qa
  - mmsu
  - alpacaeval_full
  - alpacaeval
  - ifeval
  - advbench
  - commoneval
  - wildvoice
  - alpacaeval_speaker
  - openbookqa
  - bbh

# Scoring settings
api_type: nvidia
nvidia_model: azure/openai/gpt-4o-mini

installation_command: ""
scoring_installation_command: "pip install --cache-dir /lustre/fsw/portfolios/llmservice/users/yuanhangs/cache/pip sacrebleu qa_metrics"

expname: voicebench_s2s_incremental_v2_text_26feb
decoding_mode: greedy
generation_only: false
scoring_only: false
dry_run: false
