executor: slurm

# Running directly from cluster — no ssh_tunnel needed
job_dir: /lustre/fsw/portfolios/llmservice/users/yuanhangs/workspace/code/nemo-run-fc

account: nemotron_speech_chat
# account: llmservice_nemo_reasoning
partition: batch_block1,batch_block3,batch_block4
cpu_partition: cpu_short
exclusive_cpu_partitions: [cpu, cpu_short]
job_name_prefix: ""

containers:
  trtllm: /lustre/fsw/portfolios/llmservice/users/igitman/llm/images/nemo-skills-trtllm-0.7.0.sqsh
  vllm: /lustre/fsw/portfolios/llmservice/users/igitman/llm/images/nemo-skills-vllm-0.7.0.sqsh
  sglang: /lustre/fsw/portfolios/llmservice/users/igitman/llm/images/nemo-skills-sglang-0.7.0.sqsh
  nemo: /lustre/fsw/portfolios/llmservice/users/igitman/llm/images/nemo-skills-nemo-0.7.0.sqsh
  nemo-rl: /lustre/fsw/portfolios/llmservice/users/igitman/llm/images/nemo-skills-nemo-rl-0.7.0.sqsh
  megatron: /lustre/fsw/portfolios/llmservice/users/igitman/llm/images/nemo-skills-megatron-0.7.0.sqsh
  sandbox: /lustre/fsw/portfolios/llmservice/users/igitman/llm/images/nemo-skills-sandbox-0.7.1.sqsh
  nemo-skills: /lustre/fsw/portfolios/llmservice/users/igitman/llm/images/nemo-skills-0.7.0.sqsh
  verl: /lustre/fsw/portfolios/llmservice/users/igitman/llm/images/nemo-skills-verl-0.7.0.sqsh

mounts:
  - /lustre:/lustre
  - /lustre/fs12/portfolios/llmservice/projects/llmservice_nemo_speechlm/data/nemo_skills/dataset:/dataset

required_env_vars:
  - NV_INFERENCE_KEY=sk-0FmWOB5rZSCzoBLYbFKl8Q

env_vars:
  - HF_HOME=/lustre/fsw/portfolios/llmservice/users/yuanhangs/cache/huggingface
  - AUDIO_SAVE_DIR=/lustre/fsw/portfolios/llmservice/users/yuanhangs/nemo_skills_fc/audio_save_dir
  - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  # Shared lustre caches — avoid re-downloading pip wheels, torch.hub repos,
  # vLLM/triton kernel artifacts, and other ~/.cache content on every job.
  # PIP_NO_CACHE_DIR=false: neutralizes the NVIDIA scoring-container image which
  # bakes in PIP_NO_CACHE_DIR=1 in /etc/environment plus `no-cache-dir = true`
  # in 5 pip.conf locations (autogenerated by NVIDIA PyIndex). Without this
  # override, PIP_CACHE_DIR below has no effect inside that container.
  - PIP_NO_CACHE_DIR=false
  - PIP_CACHE_DIR=/lustre/fsw/portfolios/llmservice/users/yuanhangs/cache/pip
  - UV_CACHE_DIR=/lustre/fsw/portfolios/llmservice/users/yuanhangs/cache/uv
  - TORCH_HOME=/lustre/fsw/portfolios/llmservice/users/yuanhangs/cache/torch
  - TRITON_CACHE_DIR=/lustre/fsw/portfolios/llmservice/users/yuanhangs/cache/triton
  - VLLM_CACHE_ROOT=/lustre/fsw/portfolios/llmservice/users/yuanhangs/cache/vllm
  - XDG_CACHE_HOME=/lustre/fsw/portfolios/llmservice/users/yuanhangs/cache/xdg

timeouts:
  batch_block1,batch_block3,batch_block4: 04:00:00
  interactive: 04:00:00
  interactive_singlenode: 04:00:00
  cpu_short: 04:00:00

mail_type: FAIL
mail_user: # <your email goes here>
